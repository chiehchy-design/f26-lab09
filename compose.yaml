# CampusReserve as several copies behind one proxy.
#
#   docker compose up -d --build --scale api=2
#   docker compose logs api                 # each copy's tokens
#   docker compose run --rm --no-deps k6 run /load/tokens.js -e TOKEN=...
#
# k6 sits in the "load" profile so `up` leaves it alone.
services:
  api:
    build: .
    expose:
      - "8080"

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    volumes:
      - ./load:/load:ro
    depends_on:
      - proxy
